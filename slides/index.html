<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>功率控制与超级电容 · 硬件组培训</title>

</head>
<body>

<!-- ============ 全局 SVG 箭头标记（只定义一次，避免各页重复导致颜色串掉） ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8aea5"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8aea5"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8aea5"/></marker><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8aea5"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8aea5"/></marker><marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8aea5"/></marker><marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8aea5"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c5f76a"/></marker><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c5f76a"/></marker><marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69c8e0"/></marker></defs></svg>

<!-- ============ 舞台 ============ -->
<div id="stage">

  <header class="masthead">
    <div class="brand"><b>RM</b>功率控制与超级电容<span>硬件组培训</span></div>
    <div class="mh-right" id="mhRight">开场</div>
  </header>

  <div class="deck" id="deck"></div>

  <footer class="stage-footer">
    <span class="section-name" id="sectionName">开场</span>
    <div class="progress-line"><span id="progressBar"></span></div>
    <span class="page-count"><b id="pageNow">1</b><em>&nbsp;/&nbsp;<span id="pageTotal">—</span></em></span>
  </footer>
</div>

<!-- ============ 底部控件 ============ -->
<div class="dock" id="dock">
  <button id="btnPrev" title="上一页" aria-label="上一页">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="chip" id="btnOverview" title="快速导航 (G)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>导航</span>
  </button>
  <button id="btnNext" title="下一页" aria-label="下一页">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<!-- ============ 快速导航浮层 ============ -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-head">
    <h2>快速导航</h2>
    <div class="overlay-filters" id="overlayFilters"></div>
    <button class="closebtn" id="btnCloseOverview" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="overlay-grid" id="overlayGrid"></div>
</div>

<!-- ============ 键盘提示 ============ -->
<div class="hint" id="hint">
  <kbd>←</kbd><kbd>→</kbd> 翻页 &nbsp;·&nbsp; <kbd>G</kbd> 快速导航 &nbsp;·&nbsp; <kbd>F</kbd> 全屏
</div>

<!-- ============ MathJax 配置 ============ -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true,
    processEnvironments: true
  },
  svg: { fontCache: 'global' },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
    ignoreHtmlClass: 'no-mathjax'
  },
  startup: { typeset: false }
};
</script>
<script src="js/mathjax-tex-svg.js"></script>

<script src="js/slides-p0.js"></script>
<script src="js/slides-p1.js"></script>
<script src="js/slides-p2.js"></script>
<script src="js/deck.js"></script>
</body>
</html>
